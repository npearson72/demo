name: demo-api-stage
region: nyc

databases:
  - name: demo-stage-db
    cluster_name: demo-stage-db

services:
  - name: api
    dockerfile_path: apps/api/Dockerfile
    source_dir: /
    github:
      repo: npearson72/demo
      branch: dev
      deploy_on_push: false # Manual trigger only
    instance_count: 1
    instance_size_slug: basic-xxs
    http_port: 3000
    health_check:
      http_path: /status
      timeout_seconds: 10
      port: 3000
    envs:
      - key: APP_REGION
        value: NYC
      - key: DATABASE_HOST
        value: ${demo-stage-db.HOSTNAME}
      - key: DATABASE_PORT
        value: ${demo-stage-db.PORT}
      - key: DATABASE_NAME
        value: ${demo-stage-db.DATABASE}
      - key: DATABASE_USER
        value: ${demo-stage-db.USERNAME}
      - key: DATABASE_PASSWORD
        value: ${demo-stage-db.PASSWORD}
      - key: DATABASE_CA_CERT
        value: ${demo-stage-db.CA_CERT}
      - key: LOG_LEVEL
        value: debug
      - key: NODE_ENV
        value: stage
      - key: PORT
        value: '3000'
    run_command: bun run src/index.ts

jobs:
  - name: migrate
    kind: PRE_DEPLOY
    dockerfile_path: apps/api/Dockerfile
    source_dir: /
    github:
      repo: npearson72/demo
      branch: dev
    instance_size_slug: basic-xxs
    envs:
      - key: DATABASE_HOST
        value: ${demo-stage-db.HOSTNAME}
      - key: DATABASE_PORT
        value: ${demo-stage-db.PORT}
      - key: DATABASE_NAME
        value: ${demo-stage-db.DATABASE}
      - key: DATABASE_USER
        value: ${demo-stage-db.USERNAME}
      - key: DATABASE_PASSWORD
        value: ${demo-stage-db.PASSWORD}
      - key: DATABASE_CA_CERT
        value: ${demo-stage-db.CA_CERT}
      - key: NODE_ENV
        value: stage
    run_command: sh -c "cd /demo && pnpm --filter @demo/api db:migrate"
